# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "dotnet-layer"
BBFILE_PATTERN_dotnet-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_dotnet-layer = "7"

LAYERSERIES_COMPAT_dotnet-layer = "kirkstone scarthgap styhead walnascar whinlatter wrynose"

# Major .NET version to use: 8, 9, 10 or 11 (11 is a release candidate).
# Override in local.conf or your distro config, e.g. DOTNET_VERSION = "9".
# The ${@} expression is expanded lazily, so a DOTNET_VERSION set after this
# file is parsed (local.conf, distro.conf) is honoured.
DOTNET_VERSION ??= "10"
PREFERRED_VERSION_dotnet-sdk-native ?= "${@ {'8':'8.0.%', '9':'9.0.%', '10':'10.0.%', '11':'11.0.%'}.get(d.getVar('DOTNET_VERSION'), '10.0.%')}"
